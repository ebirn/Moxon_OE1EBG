---
name: CI

"on":
  push:
    branches:
      - main
      - "**"
  pull_request:

permissions:
  contents: read
  actions: read

# A push to a branch with an open PR fires both "push" and "pull_request".
# Group both under the branch name (head_ref for PRs, ref for plain pushes)
# so the older, now-redundant run gets cancelled instead of both running.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-artifacts-dry-run:
    uses: ebirn/freecad_tools/.github/workflows/reusable-build-3mf-artifacts.yml@main
    with:
      config_path: .freecad_tools/config.yml
      project_root: .
      gui_session: item
      dry_run: true
      artifact_glob: prints/** docs/**

  notebook-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      # Matplotlib scans every installed font and builds a cache on first use
      # in a fresh environment ("Matplotlib is building the font cache...").
      # Caching it avoids paying that cost from scratch on every run.
      - name: Cache matplotlib font cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/matplotlib
          key: matplotlib-fontcache-${{ runner.os }}
      # Execution time on shared GH-hosted runners varies wildly for this step
      # (observed 4s-612s across otherwise-identical runs with a warm cache)
      # due to runner-to-runner CPU/noisy-neighbor variance, not anything in
      # the notebooks themselves - confirmed by running the identical code
      # natively (arm64 Linux via podman, exact uv.lock-pinned versions) in a
      # consistent ~5s every time. The per-cell timeout here is generous
      # accordingly; the job-level timeout-minutes above is the real backstop
      # against a genuine hang.
      - name: Execute notebooks
        run: |
          for f in notebooks/*.ipynb; do
            echo "::group::$f"
            uv run jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=900 \
              --output-dir "$(mktemp -d)" "$f"
            echo "::endgroup::"
          done
