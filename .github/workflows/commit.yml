---
name: CI

"on":
  push:
    branches:
      - main
      - "**"
  pull_request:

permissions:
  contents: read
  actions: read

# A push to a branch with an open PR fires both "push" and "pull_request".
# Group both under the branch name (head_ref for PRs, ref for plain pushes)
# so the older, now-redundant run gets cancelled instead of both running.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-artifacts-dry-run:
    uses: ebirn/freecad_tools/.github/workflows/reusable-build-3mf-artifacts.yml@main
    with:
      config_path: .freecad_tools/config.yml
      project_root: .
      gui_session: item
      dry_run: true
      artifact_glob: prints/** docs/**

  notebook-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Execute notebooks
        run: |
          for f in notebooks/*.ipynb; do
            echo "::group::$f"
            uv run jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=180 \
              --output-dir "$(mktemp -d)" "$f"
            echo "::endgroup::"
          done
